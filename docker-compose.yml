services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: veilworlds
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/veilworlds?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3001
      HOST: 0.0.0.0
      CORS_ORIGIN: https://veilworlds.quest
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ''
      SMTP_PASS: ''
      SMTP_FROM: booking@veilworlds.quest
      EXTERNAL_API_URL: https://calendar.questroom.ua/api-out
      TELEGRAM_BOT_TOKEN: 8380679501:AAEGi1QyWi-fx34jMHKZ7v9BIWXq2f1So8Q
      TELEGRAM_CHAT_ID: -5148635764
    ports:
      - '3001:3001'
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/web/dist:/usr/share/nginx/html/web:ro

      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
